services:
  - type: web
    name: trashformers-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trashformers-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        value: "AIzaSyA2F1vTrzbNG_tlHiAQzS53hUB-rUHJn_I"

databases:
  - name: trashformers-db
    plan: free
